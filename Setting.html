<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8">
<base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自動送信の設定と管理</title>
<!-- 採点画面と式作成にも配信する共通配色。色の追加・変更はここに集約する。 -->
<style id="app-theme">
:root{
 --paper:#f6f5f0;--white:#fffefa;--ink:#1b3436;--muted:#5e7070;
 --line:#dce3df;--teal:#176b61;--teal-hover:#105449;--wash:#e7f0ea;
 --red:#9e352c;--amber:#895719;--input-bg:#fff;--on-accent:#fff;
 --control-line:#bdcbc5;--placeholder:#8a9494;--disabled-bg:#eceee8;
 --focus:#d69c41;--focus-ring:#d69c4133;--selection-line:#cbded3;--step-line:#b6c6bc;
 --danger-line:#d8aaa4;--error-line:#dfbcb6;--warning-bg:#f8efdd;--warning-line:#d6b77e;
 --field-bg:#f4f6f1;--token-bg:#f4f7f2;--preview-bg:#f0f4ee;
 --shadow:#14342a33;--backdrop:#18332d66;
}
</style>
<style>
*{box-sizing:border-box}
html{height:100%;overflow:hidden}
body{height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden;margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 "Segoe UI",Meiryo,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);padding:7px 12px;font-weight:600;line-height:1.5}
button:hover:not(:disabled){border-color:var(--teal);background:var(--wash)}
button:disabled{opacity:.48;cursor:not-allowed}
button.primary{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
button.primary:hover:not(:disabled){background:var(--teal-hover)}
button.danger{color:var(--red);border-color:var(--danger-line)}
button.link{border:0;background:transparent;padding:5px 0;color:var(--teal);text-align:left}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
input,select,textarea{width:100%;background:var(--input-bg);border:1px solid var(--control-line);border-radius:7px;padding:7px 10px;color:var(--ink)}
input[type=checkbox]{width:auto;accent-color:var(--teal)}
textarea{resize:vertical;min-height:52px;line-height:1.5}
label{display:block;font-weight:600;margin-bottom:4px}
h1,h2,h3,p{margin:0}
h1{font-size:18px;letter-spacing:.02em}
h2{font-size:23px;line-height:1.4;font-weight:650}
h3{font-size:16px}
p+p{margin-top:8px}
.muted,.help{color:var(--muted)}
.help{font-size:12px;margin-top:6px;line-height:1.65}
.help-heading,.help-label{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.help-heading h2,.help-heading h3,.help-label label{margin:0}
.help-label{margin-bottom:6px}
button.context-help[type="button"]{display:inline-flex;align-items:center;justify-content:center;flex:none;width:18px;height:18px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--wash);color:var(--muted);font-size:12px;line-height:1;font-weight:bold;cursor:help;vertical-align:middle}
button.context-help:hover{background:var(--control-line);color:var(--ink)}
button.context-help:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.context-tooltip{position:fixed;z-index:1000;width:max-content;max-width:min(360px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;padding:12px;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 12px var(--shadow);font-size:13px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.context-tooltip strong{display:block;margin-bottom:6px}
.eyebrow{font-size:11px;letter-spacing:.15em;color:var(--teal);font-weight:700;margin-bottom:4px}
.app-header{flex:none;padding:12px 22px 0;background:var(--white);border-bottom:1px solid var(--line)}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:14px}
.head-row p{font-size:12px;color:var(--muted);margin-top:3px}
.brand{display:flex;gap:13px;align-items:center}
.header-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.top-nav{display:flex;gap:24px;margin-top:8px}
.top-nav button{border:0;border-bottom:3px solid transparent;border-radius:0;padding:8px 1px;background:transparent;color:var(--muted)}
.top-nav button[aria-current=page]{border-bottom-color:var(--teal);color:var(--teal)}
.workspace{flex:1;display:grid;grid-template-columns:202px minmax(0,1fr);grid-template-rows:minmax(0,1fr);min-height:0;overflow:hidden}
.rail{display:flex;flex-direction:column;min-height:0;overflow:hidden;padding:16px 10px;border-right:1px solid var(--line)}
.rail[hidden]{display:none}
.rail-title{flex:none;margin:0 10px 10px;font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--muted)}
.steps{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;display:grid;grid-auto-rows:min-content;align-content:start;gap:3px;padding:3px}
.step{display:flex;align-items:center;gap:9px;text-align:left;border-color:transparent;background:transparent;padding:8px;font-size:13px}
.step[aria-current=step]{background:var(--wash);border-color:var(--selection-line)}
.step-number{flex:none;display:grid;place-items:center;width:27px;height:27px;border:1px solid var(--step-line);border-radius:50%;font-size:11px;font-weight:500}
.step.complete .step-number{background:var(--teal);border-color:var(--teal);color:var(--on-accent)}
.step-copy{flex:1}
.step-copy small{display:block;font-size:10px;font-weight:400;color:var(--muted);line-height:1.35}
.draft-dot{color:var(--amber);font-size:11px}
.rail-note{flex:none;margin:14px 10px 0;font-size:11px;color:var(--muted)}
.content{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:10px 16px 16px;min-width:0;width:100%;scroll-padding:16px}
.content:focus-visible{outline-offset:-3px}
.intro{margin-bottom:16px}
.intro .muted{margin-top:6px;max-width:760px}
.progress-info{display:flex;gap:10px;align-items:baseline;margin-top:8px;font-size:12px}
.tag{display:inline-block;font-size:11px;line-height:1.5;padding:4px 9px;border-radius:99px;background:var(--disabled-bg);color:var(--muted)}
.tag.complete{background:var(--wash);color:var(--teal)}
.tag.attention{background:var(--warning-bg);color:var(--amber)}
.card{background:var(--white);border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:8px}
.card h3+.muted{margin-top:6px}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:8px}
.grid{display:grid;gap:8px 12px;align-items:start}
.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.configuration-io>section{min-width:0}
.configuration-io [hidden]{display:none}
.configuration-io h3{margin-bottom:8px}
.configuration-io .profile-file{margin-top:0}
.configuration-io .check-line{width:max-content;max-width:100%;margin-bottom:4px}
.configuration-io .profile-summary{white-space:pre-line;overflow-wrap:anywhere}
.form-item+.form-item{margin-top:8px}
.source-grid .form-item{margin:0;min-width:0}
.divider{border:0;border-top:1px solid var(--line);margin:8px 0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:14px 0}
.stat strong{display:block;font-size:24px;font-weight:550;line-height:1.3}
.stat span{font-size:11px;color:var(--muted)}
.instruction{display:flex;gap:10px;margin-top:12px}
.instruction>span{font-size:12px;color:var(--teal);padding-top:1px}
.instruction p{font-size:13px}
.form-footer{display:flex;align-items:center;gap:13px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.form-footer .help{flex:1;margin:0}
.field-card{padding:8px 10px;background:var(--field-bg);border:1px solid var(--line);border-radius:10px;margin:8px 0}
.field-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.field-card label{font-size:12px}
.field-card details{margin-top:10px}
summary{cursor:pointer;color:var(--teal);font-size:12px}
.token-list{display:grid;gap:6px;margin-top:10px}
.token{display:block;text-align:left;padding:7px 10px;background:var(--token-bg);font-weight:400}
.token strong{font-size:12px}
.token small{display:block;font-size:11px;color:var(--muted)}
.template-box{min-height:200px}
.template-grid{grid-template-columns:minmax(0,1.3fr) minmax(220px,1fr)}
.template-grid>.card{min-width:0}
.template-grid .token-list{max-height:330px;overflow:auto;overscroll-behavior:contain;padding:3px}
.preview{white-space:pre-wrap;word-break:break-word;background:var(--preview-bg);border-radius:9px;padding:14px;margin-top:10px;min-height:64px;font-family:inherit;font-size:13px}
.preview-empty{color:var(--muted)}
.action-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.action-row:last-child{border-bottom:0}
.action-row>div{flex:1}
.action-row h3{font-size:14px}
.action-row p{font-size:12px;color:var(--muted);margin-top:3px}
.navigation-link,.sheet-open{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:34px;padding:7px 12px;border:1px solid var(--teal);border-radius:8px;background:var(--teal);color:var(--on-accent);font-family:inherit;font-size:13px;font-weight:700;line-height:1.5;text-decoration:none;cursor:pointer}
.navigation-link[hidden],.sheet-open[hidden]{display:none}
.navigation-link:hover,.sheet-open:hover{background:var(--teal-hover);border-color:var(--teal-hover);color:var(--on-accent)}
.navigation-link:focus-visible,.sheet-open:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.sheet-open{padding:5px 9px;font-size:12px}
.sheet-links{display:flex;gap:13px;flex-wrap:wrap;margin-top:12px}
.profile-file{margin-top:12px}
.check-line{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:400}
.check-line input{margin-top:5px}
.status{flex:none;max-height:100px;overflow:auto;margin:0 16px 6px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--white);font-size:13px;white-space:pre-line;overflow-wrap:anywhere}
.status[data-kind=error]{color:var(--red);border-color:var(--error-line)}
.status[data-kind=success]{color:var(--teal)}
.status:empty{display:none}
.global-footer{flex:none;border-top:1px solid var(--line);padding:7px 22px;display:flex;justify-content:space-between;gap:12px;background:var(--white);font-size:11px;color:var(--muted)}
.full-width{grid-column:1/-1}
.loading{padding:50px;color:var(--muted)}
.busy-line{height:3px;background:var(--teal);position:fixed;top:0;left:0;right:0;z-index:10}
dialog{max-height:calc(100dvh - 24px);overflow:auto;width:min(520px,calc(100vw - 32px));padding:28px;border:1px solid var(--line);border-radius:16px;color:var(--ink);background:var(--white);box-shadow:0 20px 70px var(--shadow)}
dialog::backdrop{background:var(--backdrop)}
dialog h2{font-size:22px}
dialog .summary{white-space:pre-line;margin:8px 0 20px;font-size:13px}
dialog .actions{justify-content:flex-end}
.notice{background:var(--wash);border-left:3px solid var(--teal);padding:10px 12px;margin:12px 0;font-size:12px}
.profile-summary{white-space:pre-wrap;font-size:12px}
.hour-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:8px}
.hour-grid label{font-size:12px}
.schedule-line{display:flex;gap:8px;align-items:center}
.last-run{font-size:12px;padding:7px 0;color:var(--muted)}

@media(max-width:760px){
.app-header{padding:9px 14px 0}
.head-row{gap:8px;flex-wrap:wrap}
.head-row p{display:none}
h1{font-size:16px}
.header-tools{gap:5px;justify-content:flex-start}
.header-tools button,.header-tools .navigation-link{font-size:11px;padding:6px 8px}
.top-nav{gap:20px;margin-top:5px}
.top-nav button{padding:6px 1px}

.workspace{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.workspace:not(.setup-layout){grid-template-rows:minmax(0,1fr)}
.rail{border-right:0;border-bottom:1px solid var(--line);padding:6px 10px;overflow:hidden}
.rail-title,.rail-note{display:none}

.step{flex:0 0 auto;gap:5px;padding:6px 8px;font-size:11px;white-space:nowrap}
.step-number{width:22px;height:22px}
.step-copy small{display:none}

.content{padding:14px}
.two,.template-grid{grid-template-columns:1fr}
.card{padding:10px}
h2{font-size:21px}
.hour-grid{grid-template-columns:1fr}
.action-row{align-items:flex-start;flex-wrap:wrap}
.global-footer{padding:6px 14px;gap:6px}
.global-footer>span:last-child{display:none}
.status{max-height:80px;margin:0 10px 5px;font-size:12px}
.template-grid .token-list{max-height:230px}

}

@media(max-height:700px){.rail-note{display:none}}
@media(max-height:540px){.head-row p{display:none}
.app-header{padding-top:7px}
.top-nav{margin-top:3px}
.rail{padding-top:8px}
.rail-title{margin-bottom:5px}
.step{padding-top:6px;padding-bottom:6px}
.status{max-height:64px}
.global-footer{padding-top:4px;padding-bottom:4px}
}

@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}
.busy-line{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.35}
}
}

.grade-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:10px;align-items:end;margin-top:6px}
.grade-row>span{padding-bottom:8px}
.grade-row label{font-size:12px}
.diagnostic-check{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.diagnostic-check>.tag{align-self:flex-start;flex-shrink:0}
.diagnostic-check h3{font-size:14px}
.sample{border-top:1px solid var(--line);padding:10px 0;margin-top:8px}
.sample summary{font-size:13px;line-height:1.9}
.sample-meta{display:grid;grid-template-columns:80px minmax(0,1fr);gap:5px;margin:15px 0;font-size:12px}
.sample-meta dt{color:var(--muted)}
.sample-meta dd{margin:0;overflow-wrap:anywhere}
.diagnostic-check p,.action-row p{overflow-wrap:anywhere}
@media(max-width:520px){.grade-row{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.grade-row button{grid-column:3}
.diagnostic-check{display:block}
.diagnostic-check>.tag{margin-bottom:7px}
}
.progress-info{margin:0 0 6px}.stats{gap:16px;margin:4px 0 8px}.stat{display:flex;gap:6px;align-items:baseline}.stat strong{font-size:18px}.actions{margin-top:8px}.form-footer{margin-top:10px;padding-top:8px}.form-item+.form-item{margin-top:8px}.field-heading{margin-bottom:5px}.field-card details{margin-top:6px}.compact-heading{display:flex;gap:12px;align-items:center;justify-content:space-between}.compact-heading .actions{margin:0}.entry-row{display:flex;gap:6px;align-items:center;margin:5px 0}.entry-row textarea{height:58px;min-height:58px}.entry-row button{flex:none}.entry-list+ .actions{margin-top:4px}.source-grid{margin-top:10px}.token-list{gap:3px}.token-row{display:flex;gap:3px;align-items:center}.token{display:flex;gap:8px;align-items:baseline;flex:1;min-width:0;padding:5px 7px}.token strong{font-size:11px;overflow-wrap:anywhere}.token span{font-size:11px;color:var(--muted);overflow-wrap:anywhere}.token-info{padding:4px 7px;flex:none}.common-scale{margin-top:10px}.field-scale summary{overflow-wrap:anywhere}.common-scale summary{overflow-wrap:anywhere}.sheet-links{gap:6px;margin-top:8px}.sheet-links button{font-size:12px;padding:5px 9px}.check-line{margin-top:7px}.profile-file{margin-top:5px}.next-step{justify-content:flex-end}.prepare-actions{margin-top:12px}.diagnostic-results{margin-top:8px}.content>.card:first-child{margin-top:0}.content>.progress-info+.card{margin-top:0}
@media(max-width:520px){.head-row{flex-wrap:wrap}.header-tools{width:100%}.header-tools button{flex:1}.hour-grid{gap:6px}.compact-heading{flex-wrap:wrap}.template-box{min-height:140px}.content{padding:10px}.token{flex-wrap:wrap;gap:0 6px}}

@media(max-width:760px){.field-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

<div class="busy-line" id="busyLine" hidden></div>
<header class="app-header"><div class="head-row"><div class="brand"><div><h1>自動送信の設定と管理</h1><p>最初に整えて、毎日の処理は自動に。</p></div></div><div class="header-tools"><a id="scoringScreenLink" class="navigation-link" hidden target="_blank" rel="noopener">採点画面</a><a id="operationScreenLink" class="navigation-link" hidden target="_blank" rel="noopener">運用スプレッドシート</a><button type="button" data-panel="settings">設定を保存・出力</button><button type="button" data-command="refresh">状態を更新</button><button type="button" data-command="close">閉じる</button></div></div><nav class="top-nav" aria-label="管理メニュー"><button type="button" data-panel="setup" aria-current="page">設定</button><button type="button" data-panel="maintenance">管理</button><button type="button" data-panel="manual">手動実行</button></nav></header>
<div class="workspace setup-layout" id="workspace"><aside class="rail" id="rail"><p class="rail-title">セットアップガイド</p><nav class="steps" id="stepNav" aria-label="設定の手順"></nav><p class="rail-note">途中まででも保存できます。<br>毎日の操作は必要ありません。</p></aside><main class="content" id="content" tabindex="-1"><p class="loading">設定とシートの状態を読み込んでいます…</p></main></div>
<div id="statusRegion" class="status" role="status" aria-live="polite" aria-atomic="true"></div><footer class="global-footer"><span id="draftStatus">保存済みの設定を確認しています</span><span>Classroom 自動送信</span></footer>
<dialog id="confirmDialog" aria-labelledby="confirmTitle" aria-describedby="confirmSummary"><h2 id="confirmTitle"></h2><p class="summary" id="confirmSummary"></p><label class="check-line"><input type="checkbox" id="confirmCheck">対象と影響を確認しました</label><form method="dialog" id="confirmForm"><div class="actions"><button type="submit" value="cancel" id="confirmCancel">キャンセル</button><button type="submit" value="confirm" class="primary" id="confirmAccept" disabled>実行する</button></div></form></dialog>
<div id="contextTooltip" class="context-tooltip" role="tooltip" hidden><strong id="contextHelpTitle"></strong><span id="contextHelpBody"></span></div>
<script>
'use strict';
const steps = [
 {id:'prepare',title:'シートを準備',subtitle:'新規作成・JSONの再利用'},
 {id:'classes',title:'クラスと生徒',subtitle:'対象の選択・名簿の取得'},
 {id:'forms',title:'フォームを準備',subtitle:'ひな形・クラス別に作成'},
 {id:'sources',title:'回答先と通知先',subtitle:'接続・クラスの対応表'},
 {id:'fields',title:'列と項目',subtitle:'列の役割・評価の変換'},
 {id:'template',title:'メッセージ',subtitle:'本文と差し込み'},
 {id:'publish',title:'資料を投稿',subtitle:'Classroomに配布・受付管理'},
 {id:'automation',title:'自動実行',subtitle:'日本時間・開始と停止'}
];
const requiredSteps=['prepare','classes','students','sources','mapping','fields','template'];
const state = { data:null, automation:null, drafts:{}, headers:[], panel:'setup', step:'prepare', busy:false, profile:null, preview:null, diagnostic:null, includeTemplateFormUrl:false, includeReminderTo:false, exportKind:'bundle', returnPanel:null, openGrades:[], commonGradeOpen:false, bootstrap:null, forms:null, formDraft:null, formPlan:null, formsLoading:false, formsLoadingPromise:null, formsError:'' };
const $ = id => document.getElementById(id);
const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const copy = value => JSON.parse(JSON.stringify(value));
function progressFor(id) { return ((state.data&&state.data.progress)||[]).find(item=>item.id===id)||{id,state:'pending',detail:'未確認'}; }
function automationReady() { return !!state.data&&!state.data.recoveryRequired&&!state.data.configParseError&&state.data.ready!==false&&requiredSteps.every(id=>progressFor(id).state==='complete'); }
function visibleProgress(id){
 if(['forms','publish'].includes(id)&&state.formsError&&showsFormData())return {id,state:'attention',detail:'最新情報を取得できません。手順を開いて再取得してください。'};
 if(id==='forms'||id==='publish')return !state.formsStale&&state.forms&&state.forms.setupProgress&&state.forms.setupProgress[id]||progressFor(id);
 if(!['classes','sources'].includes(id))return progressFor(id);
 const parts=(id==='classes'?['classes','students']:['sources'].concat(state.data&&state.data.mappingNeeded||count('mappings')?['mapping']:[])).map(progressFor);
 return {id,state:parts.every(p=>p.state==='complete')?'complete':parts.some(p=>p.state==='attention')?'attention':'pending',detail:''};
}
function dirtySections() { return Object.keys(state.drafts); }
function sectionBase(section) {
 const c=state.data&&state.data.config||{};
 if(section==='sources') return {formSources:(c.formSources||[]).map(s=>parseSourceLine(formatSourceLine(s))),formSheetNamePrefix:c.formSheetNamePrefix||[],reminderTo:c.reminderTo||[]};
 if(section==='fields') return {emailHeader:c.emailHeader||'',studentNameHeader:c.studentNameHeader||'',formStatusHeader:c.formStatusHeader||'',scoreSourceHeader:c.scoreSourceHeader||'',replyBodyHeader:c.replyBodyHeader||'',fields:c.fields||[],gradeScale:Array.isArray(c.gradeScale)?c.gradeScale:[{from:'5',to:'A'},{from:'4',to:'B+'},{from:'3',to:'B'},{from:'2',to:'B-'},{from:'1',to:'C'}]};
 if(section==='template') return {messageTemplate:c.messageTemplate||''};
 if(section==='automation') return state.automation&&state.automation.schedule||{importHour:5,deliveryHour:8,reminderHour:16,reminderEnabled:false};
 return {};
}
function draftValue(section) { return copy(state.drafts[section]?state.drafts[section].payload:sectionBase(section)); }
function draftRevision(section) { return state.drafts[section]?state.drafts[section].revision:section==='automation'?(state.automation&&state.automation.revision):state.data.revision; }
function stableJson(value) { return JSON.stringify(value, function(key,item){ if(item&&typeof item==='object'&&!Array.isArray(item))return Object.keys(item).sort().reduce((obj,k)=>{obj[k]=item[k];return obj;},{});return item; }); }
function putDraft(section,payload) { if(stableJson(payload)===stableJson(sectionBase(section))) { delete state.drafts[section]; return; } state.diagnostic=null; state.drafts[section]={payload:copy(payload),revision:draftRevision(section)}; }
function acceptData(data) { state.data=data; }
function rebaseDrafts(oldRevision,newRevision) { dirtySections().forEach(section=>{if(section!=='automation'&&state.drafts[section].revision===oldRevision)state.drafts[section].revision=newRevision;}); }
function status(message,kind) { $('statusRegion').textContent=message||''; $('statusRegion').dataset.kind=kind||''; }
function setBusy(busy) {
 state.busy=busy; $('busyLine').hidden=!busy; $('workspace').setAttribute('aria-busy',String(busy));
 document.querySelectorAll('button,input,select,textarea').forEach(el=>{if(el.closest('dialog'))return; if(busy){el.dataset.wasDisabled=String(el.disabled);el.disabled=true;}else if('wasDisabled'in el.dataset){el.disabled=el.dataset.wasDisabled==='true';delete el.dataset.wasDisabled;}});
}
function rpc(method,...args) { return new Promise((resolve,reject)=>{google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[method](...args);}); }
function offerSettingsDownload(result,container){
 if(state.downloadUrl)URL.revokeObjectURL(state.downloadUrl);
 const url=URL.createObjectURL(new Blob([result.json],{type:'application/json;charset=utf-8'})),a=document.createElement('a');
 state.downloadUrl=url;
 a.href=url;a.download=result.filename;a.textContent=' 設定JSONを保存';(container||document.body).appendChild(a);a.click();
 // ブラウザが自動ダウンロードを止めても使えるよう、リンクを残す。
 if(!container){a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
}
async function task(work) { if(state.busy)return; setBusy(true); try{if(state.formsLoadingPromise)await state.formsLoadingPromise;await work();}catch(error){status((error&&error.message||String(error))+'\n入力中の内容は保持しています。内容を確認して再実行してください。','error');}finally{setBusy(false);} }
function count(key) { return Number(state.data&&state.data.counts&&state.data.counts[key]||0); }
function button(label,attribute,primary) { return '<button type="button" '+attribute+(primary?' class="primary"':'')+'>'+esc(label)+'</button>'; }
// 説明の開閉だけを行い、入力・下書き・画面の描画には触れない。
function helpButton(title,body){return body?'<button type="button" class="context-help" data-help-title="'+esc(title)+'" data-help-body="'+esc(body)+'" aria-label="'+esc(title)+'の説明">?</button>':'';}
function helpHeading(title,body){return '<div class="help-heading"><h3>'+esc(title)+'</h3>'+helpButton(title,body)+'</div>';}
function helpLabel(id,label,body){return '<div class="help-label"><label for="'+esc(id)+'">'+esc(label)+'</label>'+helpButton(label,body)+'</div>';}
let activeHelp=null,helpPinned=false,helpHideTimer=null;
function hideHelp(){
 clearTimeout(helpHideTimer);if(activeHelp)activeHelp.removeAttribute('aria-describedby');
 activeHelp=null;helpPinned=false;const tip=$('contextTooltip');if(tip)tip.hidden=true;
}
function showHelp(button){
 clearTimeout(helpHideTimer);if(activeHelp!==button){hideHelp();activeHelp=button;}
 const tip=$('contextTooltip');$('contextHelpTitle').textContent=button.dataset.helpTitle;$('contextHelpBody').textContent=button.dataset.helpBody||'';
 tip.hidden=false;button.setAttribute('aria-describedby','contextTooltip');
 const rect=button.getBoundingClientRect(),width=tip.offsetWidth,height=tip.offsetHeight;
 tip.style.left=Math.max(12,Math.min(rect.left,window.innerWidth-width-12))+'px';
 tip.style.top=Math.max(12,rect.bottom+8+height<=window.innerHeight-12?rect.bottom+8:rect.top-height-8)+'px';
}
function delayHideHelp(){if(!helpPinned){clearTimeout(helpHideTimer);helpHideTimer=setTimeout(hideHelp,120);}}
function initHelp(){
 const tip=$('contextTooltip');
 document.addEventListener('pointerover',event=>{const b=event.target.closest('.context-help');if(b&&!b.disabled)showHelp(b);else if(tip.contains(event.target))clearTimeout(helpHideTimer);});
 document.addEventListener('pointerout',event=>{if(event.target.closest('.context-help')||tip.contains(event.target))delayHideHelp();});
 document.addEventListener('focusin',event=>{const b=event.target.closest('.context-help');if(b&&!b.disabled)showHelp(b);});
 document.addEventListener('focusout',event=>{if(event.target===activeHelp)delayHideHelp();});
 document.addEventListener('click',event=>{if(!event.target.closest('.context-help')&&!tip.contains(event.target))hideHelp();});
 document.addEventListener('keydown',event=>{if(event.key==='Escape')hideHelp();});
 document.addEventListener('scroll',event=>{if(!tip.contains(event.target))hideHelp();},true);
 window.addEventListener('resize',hideHelp);
}
function sheetButton(key,label) {
 label=label||'シートを開く';
 const sheet=((state.data&&state.data.sheets)||[]).find(s=>s.key===key);
 return sheet&&sheet.exists&&sheet.url?'<a class="sheet-open" href="'+esc(sheet.url)+'" target="_blank" rel="noopener noreferrer">'+esc(label)+'</a>':button(esc(label),'disabled title="先に対象シートを作成してください"');
}
function stat(label,value) { return '<div class="stat"><strong>'+esc(value)+'</strong><span>'+esc(label)+'</span></div>'; }
function instruction(n,title,detail) { return '<div class="instruction"><span>0'+n+'</span><div><h3>'+esc(title)+'</h3><p class="muted">'+esc(detail)+'</p></div></div>'; }
function formItem(id,label,value,help) {
 const rows=2;
 return '<div class="form-item'+(id==='formSources'?' full-width':'')+'">'+helpLabel(id,label,help)+'<textarea id="'+id+'" rows="'+rows+'">'+esc(value)+'</textarea></div>';

function saveFooter(section) { return '<div class="form-footer">'+button('この手順を保存','data-save="'+section+'"',true)+helpButton('設定の保存','未完成でも保存できます。')+button('入力を戻す','data-discard="'+section+'"')+'</div>'; }
function headerInput(id,label,value,help) { return '<div>'+helpLabel(id,label,help)+'<input id="'+id+'" list="headerOptions" value="'+esc(value)+'" placeholder="列名を入力、または候補から選択"></div>'; }
function headerOptions() { return '<datalist id="headerOptions">'+state.headers.map(h=>'<option value="'+esc(h)+'"></option>').join('')+'</datalist>'; }
function render() {
 if(activeHelp)hideHelp();
 if(!state.data)return;
 document.querySelectorAll('[data-panel]').forEach(b=>{if(b.dataset.panel===state.panel)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 $('workspace').classList.toggle('setup-layout',state.panel==='setup');
 $('rail').hidden=state.panel!=='setup'; $('content').classList.toggle('full-width',state.panel!=='setup');
 $('stepNav').innerHTML=steps.map((s,i)=>'<button type="button" class="step '+esc(visibleProgress(s.id).state)+'" data-step="'+s.id+'"'+(state.step===s.id?' aria-current="step"':'')+'><span class="step-number">'+(visibleProgress(s.id).state==='complete'?'✓':i+1)+'</span><span class="step-copy">'+s.title+'<small>'+s.subtitle+'</small></span>'+(state.drafts[s.id]?'<span class="draft-dot" aria-label="未保存">●</span>':'')+'</button>').join('');
 if(state.panel==='setup') {
  const step=steps.find(s=>s.id===state.step)||steps[0],p=visibleProgress(step.id);
  $('content').innerHTML='<div class="progress-info"><span class="tag '+esc(p.state)+'">'+({complete:'設定済み',pending:'未完了',attention:'要確認'}[p.state]||'未確認')+'</span><span class="muted">'+esc(p.detail||'')+'</span></div>'+renderStep(step.id)+(steps.indexOf(step)<steps.length-1?'<div class="actions next-step">'+button('次へ：'+steps[steps.indexOf(step)+1].title,'data-step="'+steps[steps.indexOf(step)+1].id+'"')+'</div>':'');
 }else $('content').innerHTML=state.panel==='maintenance'?renderMaintenance():state.panel==='settings'?renderSettings():renderManual();
 if(state.data.recoveryRequired||state.data.configParseError) $('content').insertAdjacentHTML('afterbegin','<div class="notice" role="alert"><strong>設定の復旧が必要です</strong><p>'+esc((state.data.warnings||[]).join('\n')||'直前の保存を完全に復旧できませんでした。内部設定と設定JSONを確認してください。')+'</p><p>自動実行の停止は「自動実行を設定」から行えます。</p></div>');
 updateDirtyStatus();
 if(state.busy)document.querySelectorAll('#content button,#content input,#content select,#content textarea,#stepNav button').forEach(el=>{el.dataset.wasDisabled=String(el.disabled);el.disabled=true;});
}
function renderStep(id) {
 if(id==='prepare')return '<div class="actions prepare-actions">'+button('必要なシートを準備','data-action="initialize"',true)+button('前の設定を再利用(JSON)','data-panel="settings"')+'</div>';
 if(id==='classes')return '<div class="card"><div class="stats">'+stat('クラス',count('classes'))+stat('選択中',count('selectedClasses'))+stat('生徒',count('students'))+'</div>'+actionRow('1　クラス一覧を取得','','classes','取得・更新')+'<div class="action-row"><div><h3>2　対象クラスを選択</h3><p>シートの「同期対象(1)」に 1 を入力</p></div>'+sheetButton('classes','クラス一覧を開く')+'</div>'+actionRow('3　選んだクラスの生徒を取得',progressFor('students').detail||'','students','生徒を取得・更新')+'<div class="actions">'+sheetButton('students','生徒一覧を確認')+button('選択状態を更新','data-command="refresh"')+'</div></div>';
 if(id==='forms')return renderForms('prepare');
 if(id==='publish')return renderForms('publish');
 if(id==='sources'){const c=draftValue(id);return '<div class="card"><div class="help-label"><label>フォーム回答スプレッドシートのURL</label>'+helpButton('フォーム回答スプレッドシートのURL','新規作成した回答先は自動登録済み。既存フォームを使う場合は回答先を入力')+'</div>'+sourceEntries('formSources',c.formSources.map(formatSourceLine),'URL',true)+'<div class="grid two source-grid"><div>'+formItem('formSheetNamePrefix','対象シート名の先頭文字',c.formSheetNamePrefix.join('\n'),'複数は1行ずつ')+'</div><div><label>担当者の通知先メールアドレス</label>'+sourceEntries('reminderTo',c.reminderTo,'メールアドレス',false)+'</div></div>'+saveFooter(id)+'</div>'+renderMapping();}
 if(id==='fields')return renderFields();
 if(id==='template')return renderTemplate();
 return renderAutomation()+renderDiagnostics();
}

 return '<details class="card"'+(needed?' open':'')+'><summary>回答シートとクラスの対応表 '+(needed?(progressFor('mapping').state==='complete'?'<span class="tag complete">設定済み</span>':'<span class="tag attention">設定が必要</span>'):hasRows?'<span class="tag">'+count('mappings')+'行</span>':'（必要な場合のみ）')+helpButton('回答シートとクラスの対応表','同じ生徒が複数クラスにいる場合などに、回答ごとの送信先を指定します。')+'</summary>'+(sourceReady?'<div class="actions">'+button('対応表を作成・更新','data-action="mapping"')+sheetButton('mapping','対応表を開く')+'</div>'+helpButton('対応表の編集','対応表でクラス名を選び、状態を更新してください（courseIdは自動）。'):'<p class="help">先にフォームURLと対象シート名の先頭文字を保存してください。</p><div class="actions">'+button('フォームを登録する','data-command="mapping-sources"')+'</div>')+'</details>';

function gradeExample(field){const scale=effectiveScale(field);return scale.length?scale[0].to:'元の評価値';}
function effectiveScale(field){return field&&Array.isArray(field.gradeScale)?field.gradeScale:draftValue('fields').gradeScale;}
function scaleSummary(scale){return scale.length?scale.slice(0,4).map(row=>row.from+'→'+row.to).join(' / ')+(scale.length>4?' / ほか'+(scale.length-4)+'件':''):'変換表は未設定です';}

function readCurrent(){
 readScheduleDrafts();
 if(state.panel==='setup'&&state.step==='forms'){readFormDraft();return;}
 if(state.panel!=='setup'||!state.data)return;
 const id=state.step,val=key=>$(key).value;
 if(id==='sources'){const entries=key=>Array.from(document.querySelectorAll('[data-source-entry="'+key+'"]')).flatMap(el=>lines(el.value));putDraft(id,{formSources:entries('formSources').map(parseSourceLine),formSheetNamePrefix:lines(val('formSheetNamePrefix')),reminderTo:entries('reminderTo')});}
 if(id==='fields'){const p={};['emailHeader','studentNameHeader','formStatusHeader','scoreSourceHeader','replyBodyHeader'].forEach(key=>p[key]=val(key).trim());p.fields=Array.from(document.querySelectorAll('[data-field-index]')).map(row=>{const old=draftValue('fields').fields[Number(row.dataset.fieldIndex)]||{},f={evalHeader:old.evalHeader||''};if(Array.isArray(old.gradeScale))f.gradeScale=copy(old.gradeScale);row.querySelectorAll('[data-field-prop]').forEach(el=>f[el.dataset.fieldProp]=el.value.trim());if(f.type==='score_grade'&&row.dataset.customGradeRendered==='true'&&Array.isArray(f.gradeScale))f.gradeScale=Array.from(row.querySelectorAll('[data-field-grade]')).map(r=>({from:r.querySelector('[data-grade-prop="from"]').value.trim(),to:r.querySelector('[data-grade-prop="to"]').value.trim()}));return f;});p.gradeScale=Array.from(document.querySelectorAll('[data-grade-index]')).map(row=>({from:row.querySelector('[data-grade-prop="from"]').value.trim(),to:row.querySelector('[data-grade-prop="to"]').value.trim()}));putDraft(id,p);}
 if(id==='template')putDraft(id,{messageTemplate:val('messageTemplate')});
 if(id==='automation')putDraft(id,{importHour:Number(val('importHour')),deliveryHour:Number(val('deliveryHour')),reminderHour:Number(val('reminderHour')),reminderEnabled:$('reminderEnabled').checked});
 updateDirtyStatus();
}
function lines(value){return value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);}
function formatSourceLine(source){if(!source||typeof source!=='object')return String(source||'');return String(source.url||source.id||'')+(source.courseId?' | '+source.courseId:'');}
function parseSourceLine(line){const match=String(line).trim().match(/^(.+?)\s*\|\s*([A-Za-z0-9_-]+)\s*$/);return match?{url:match[1].trim(),courseId:match[2]}:{url:String(line).trim()};}
function updateDirtyStatus(){const sections=dirtySections();$('draftStatus').textContent=sections.length?'未保存：'+sections.map(id=>steps.find(s=>s.id===id).title).join('、')+'（画面の切り替え・状態の更新でも入力を保持）':'保存済みの設定を表示しています';}
function requireSaved(except){const pending=dirtySections().filter(s=>s!==except);if(pending.length){status('先に未保存の手順を保存するか「入力を戻す」を選んでください：'+pending.map(id=>steps.find(s=>s.id===id).title).join('、')+'\n入力内容は保持しています。','error');return false;}return true;}
async function refresh(initial){
 state.formsStale=true;
 const hadDiagnostic=!!state.diagnostic;state.diagnostic=null;if(hadDiagnostic&&state.data)render();
 // どちらの処理も待機しない同じサーバーロックを使うため、順番に読み取る。
 const settled=async(method,...args)=>{try{return {status:'fulfilled',value:await rpc(method,...args)};}catch(reason){return {status:'rejected',reason};}};
 const results=[await settled('getAdminConsoleData'),await settled('getAutomationState')];
 if(results[1].status==='fulfilled')state.automation=results[1].value;
 if(results[0].status==='rejected'){
  if(!state.automation)throw results[0].reason;
  if(!state.data)acceptData({config:{},progress:[],counts:{},sheets:[],revision:'',ready:false,recoveryRequired:true,warnings:['現在の設定を取得できませんでした。「状態を更新」で再試行してください。自動実行の停止はできます。']});
  state.panel='setup';state.step='automation';render();throw results[0].reason;
 }
 acceptData(results[0].value);
 if(initial){state.panel=['setup','maintenance','manual'].includes(state.data.initialPanel)?state.data.initialPanel:'setup';state.step=(steps.find(s=>visibleProgress(s.id).state!=='complete')||steps[steps.length-1]).id;}
 render();
 if(showsFormData())await refreshFormsInBackground();
 if(results[1].status==='rejected')throw results[1].reason;
}

}
async function saveAllSettings(){

 if(!sections.length){status(state.drafts.automation?'時間帯は「自動実行」で確定してください。入力は保持しています。':'保存する変更はありません。');return;}
 const revision=state.data.revision;
 if(sections.some(section=>draftRevision(section)!==revision)){status('外部で設定が変更されています。各手順の入力を確認し、競合を解消してから保存してください。入力は保持しています。','error');return;}
 const payload=Object.fromEntries(sections.map(section=>[section,draftValue(section)]));
 await task(async()=>{const result=await rpc('saveSetupSections',payload,revision);sections.forEach(section=>delete state.drafts[section]);rebaseDrafts(revision,result.revision);state.data.config=result.config;state.data.revision=result.revision;await refresh(false);status('設定を保存しました。'+(state.drafts.automation?'時間帯の入力は保持しています。「自動実行」で確定してください。':''),'success');});

function confirmAction(title,summary,label){return new Promise(resolve=>{
 const dialog=$('confirmDialog'),active=document.activeElement;
 $('confirmTitle').textContent=title;$('confirmSummary').textContent=summary;$('confirmAccept').textContent=label||'実行する';$('confirmCheck').checked=false;$('confirmAccept').disabled=true;dialog.returnValue='cancel';
 const finish=()=>{dialog.removeEventListener('close',finish);if(active&&active.isConnected)active.focus();resolve(dialog.returnValue==='confirm'&&$('confirmCheck').checked);};
 dialog.addEventListener('close',finish);dialog.showModal();$('confirmCancel').focus();
});}

 if(action==='remind')return '通知先：'+((state.data.config.reminderTo||[]).join('、')||'未設定')+'\n未採点の回答・エラーの情報をメールで送信します。';
 if(action==='clearEval')return '対象：評価データ '+count('evalRows')+' 行\nデータ行を削除します。元のフォーム回答と送信シートは残ります。削除は元に戻せません。';
 if(action==='clearSend')return '対象：送信シート '+count('sendRows')+' 行\n未送信 '+count('pendingSend')+' 件、送信確認待ち '+count('reviewSend')+' 件を含む送信記録を削除します。\n削除は元に戻せません。送信状況と必要な記録を保存してから実行してください。';

async function runAction(action){
 readCurrent();if(!requireSaved())return;
 let confirmation=false;const revision=state.data.revision;
 if(['send','remind','clearEval','clearSend','clearErrors'].includes(action)){
  const actionRevision=state.data.actionRevisions&&state.data.actionRevisions[action];
  const accepted=await confirmAction(({send:'生徒への送信',remind:'担当者への通知',clearEval:'評価データの削除',clearSend:'送信シートの削除',clearErrors:'エラーログの削除'})[action],actionSummary(action));
  if(!accepted)return;confirmation={confirmed:true,revision:actionRevision};
 }
 await task(async()=>{const result=await rpc('runAdminAction',action,confirmation,revision);await refresh(false);status(result.message||'処理が完了しました。','success');});
}
async function configureSchedule(stop){
 readCurrent();if(!stop&&!requireSaved('automation'))return;

 initHelp();
 document.addEventListener('click',event=>{handleClick(event).catch(error=>status(error.message||String(error),'error'));});
 document.addEventListener('input',event=>{if(event.target.closest('#content')){readCurrent();if(state.step==='template'){state.preview=null;const preview=$('previewText');if(preview)preview.textContent='本文を変更しました。もう一度プレビューしてください。';}}});
 document.addEventListener('change',event=>{if(event.target.dataset.profileKind)inspectFile(event.target.files[0],event.target.dataset.profileKind);else if(event.target.id==='configurationExportKind'){state.exportKind=event.target.value;render();}else if(event.target.id==='includeTemplateFormUrl')state.includeTemplateFormUrl=event.target.checked;else if(event.target.id==='includeReminderTo')state.includeReminderTo=event.target.checked;else if(event.target.closest('#content')){readCurrent();if(event.target.dataset.fieldProp==='type')render();}});
 $('confirmCheck').addEventListener('change',()=>{$('confirmAccept').disabled=!$('confirmCheck').checked;});
 window.addEventListener('beforeunload',event=>{if(dirtySections().length){event.preventDefault();event.returnValue='';}});
 task(async()=>{state.bootstrap=await rpc('getWebConsoleBootstrap');[['scoringScreenLink',state.bootstrap.scoringUrl],['operationScreenLink',state.bootstrap.url]].forEach(([id,url])=>{const a=$(id);if(a&&url){a.href=url;a.hidden=false;}});if(state.bootstrap.connected){await refresh(true);}else renderWebWelcome();});
}
boot();
</script></body></html>
